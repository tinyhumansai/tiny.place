packages:
  - "website"
  - "sdk/*"
  # plugin-claude / plugin-codex are standalone npm packages (own node_modules /
  # lockfile), not part of the pnpm workspace — keep them out of frozen install
  # + -r builds.
  - "!sdk/plugin-claude"
  - "!sdk/plugin-codex"
  # plugin-tinyplace is the unified plugin (own node_modules / lockfile) — same
  # standalone treatment: keep it out of the frozen install + recursive builds.
  - "!sdk/plugin-tinyplace"
